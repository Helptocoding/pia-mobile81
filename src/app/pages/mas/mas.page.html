<ion-header>
  <ion-toolbar color="primary"><ion-title>Más</ion-title></ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-list-header><ion-label>Académico</ion-label></ion-list-header>
    <ion-item button detail routerLink="/tabs/mas/materias">
      <ion-icon slot="start" name="book-outline"></ion-icon>
      <ion-label>Materias</ion-label>
    </ion-item>
    <ion-item button detail routerLink="/tabs/mas/inscripciones">
      <ion-icon slot="start" name="clipboard-outline"></ion-icon>
      <ion-label>Inscripciones y calificaciones</ion-label>
    </ion-item>
  </ion-list>

  @if (authEnabled) {
    <ion-list>
      <ion-list-header><ion-label>Cuenta</ion-label></ion-list-header>
      <ion-item>
        <ion-icon slot="start" name="person-circle-outline"></ion-icon>
        <ion-label>
          <h2>{{ auth.usuario }}</h2>
          <p>{{ descripcionRol }}</p>
        </ion-label>
        <ion-badge slot="end" color="primary">{{ auth.rol }}</ion-badge>
      </ion-item>
      <ion-item button (click)="cambiarPassword()">
        <ion-icon slot="start" name="key-outline"></ion-icon>
        <ion-label>Cambiar contraseña</ion-label>
      </ion-item>
      <ion-item button (click)="salir()">
        <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
        <ion-label color="danger">Cerrar sesión</ion-label>
      </ion-item>
    </ion-list>
  }
</ion-content>
